name: Sync issues to Platform Workflow

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Sync issues
        env:
          GH_TOKEN: ${{ secrets.PROJECT_SYNC_TOKEN }}
          REPO_OWNER: Levtos
          PROJECT_OWNER: Levtos
          PROJECT_NUMBER: "1"
        shell: bash
        run: |
          set -euo pipefail

          echo "Step 1: Resolve organization project via GraphQL..."

          project_json=$(
            gh api graphql \
              -F login="$PROJECT_OWNER" \
              -F number="$PROJECT_NUMBER" \
              -f query='query($login: String!, $number: Int!) {
                viewer {
                  login
                }
                organization(login: $login) {
                  projectV2(number: $number) {
                    id
                    number
                    title
                  }
                }
              }'
          )

          VIEWER=$(jq -r '.data.viewer.login' <<< "$project_json")
          PROJECT_ID=$(jq -r '.data.organization.projectV2.id' <<< "$project_json")
          PROJECT_TITLE=$(jq -r '.data.organization.projectV2.title' <<< "$project_json")

          if [[ -z "$PROJECT_ID" || "$PROJECT_ID" == "null" ]]; then
            echo "ERROR: Organization project '$PROJECT_OWNER/#$PROJECT_NUMBER' was not accessible to '$VIEWER'."
            exit 1
          fi

          echo "Authenticated as: $VIEWER"
          echo "Using organization project: $PROJECT_OWNER/$PROJECT_TITLE (#$PROJECT_NUMBER)"
          echo ""

          echo "Step 2: Get issues already in the project..."

          already=$(
            gh api graphql --paginate \
              -F login="$PROJECT_OWNER" \
              -F number="$PROJECT_NUMBER" \
              -f query='query($login: String!, $number: Int!, $endCursor: String) {
                organization(login: $login) {
                  projectV2(number: $number) {
                    items(first: 100, after: $endCursor) {
                      nodes {
                        content {
                          __typename
                          ... on Issue {
                            url
                          }
                        }
                      }
                      pageInfo {
                        hasNextPage
                        endCursor
                      }
                    }
                  }
                }
              }' \
              --jq '.data.organization.projectV2.items.nodes[] | select(.content.__typename == "Issue") | .content.url'
          )

          already_count=$(printf "%s\n" "$already" | grep -c '^https://' || true)
          echo "Found $already_count issue(s) already in the project."
          echo ""

          echo "Step 3: Get all open issues owned by $REPO_OWNER..."

          all_issues_json=$(
            gh search issues \
              --owner "$REPO_OWNER" \
              --state open \
              --limit 1000 \
              --json id,url
          )

          all_issues=$(jq -r '.[].url' <<< "$all_issues_json")
          all_issues_count=$(printf "%s\n" "$all_issues" | grep -c '^https://' || true)
          echo "Found $all_issues_count open issue(s)."
          echo ""

          echo "Step 4: Calculate missing issues..."

          to_add=$(
            comm -13 \
              <(printf "%s\n" "$already" | grep '^https://' | sort -u || true) \
              <(printf "%s\n" "$all_issues" | grep '^https://' | sort -u || true)
          )

          to_add_count=$(printf "%s\n" "$to_add" | grep -c '^https://' || true)
          echo "Found $to_add_count issue(s) to add."
          echo ""

          if [[ "$to_add_count" -eq 0 ]]; then
            echo "Everything is already synced."
            exit 0
          fi

          echo "Step 5: Add missing issues..."

          while IFS= read -r url; do
            [[ -z "$url" ]] && continue

            content_id=$(
              jq -r --arg url "$url" \
                '.[] | select(.url == $url) | .id' \
                <<< "$all_issues_json" | head -n 1
            )

            if [[ -z "$content_id" || "$content_id" == "null" ]]; then
              echo "ERROR: Could not resolve node ID for $url"
              exit 1
            fi

            echo "Adding $url"

            gh api graphql \
              -f project="$PROJECT_ID" \
              -f content="$content_id" \
              -f query='mutation($project: ID!, $content: ID!) {
                addProjectV2ItemById(input: {projectId: $project, contentId: $content}) {
                  item {
                    id
                  }
                }
              }' >/dev/null
          done <<< "$to_add"

          echo ""
          echo "Done. Added $to_add_count issue(s) to '$PROJECT_TITLE'."
